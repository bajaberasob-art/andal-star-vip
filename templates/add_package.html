{% extends "base.html" %}
{% block content %}

<style>
    /* ── تأثيرات الظهور السلس ── */
    .stagger-1 { animation: fadeUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
    .stagger-2 { animation: fadeUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }
    .stagger-3 { animation: fadeUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both; }

    /* ── تنسيق الحقول الملكية ── */
    .input-group { margin-bottom: 20px; }
    .input-label {
        display: block; font-size: 11px; font-weight: 800; color: var(--text-muted);
        margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em;
    }
    
    .input-wrap { position: relative; }
    .input-icon {
        position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        color: var(--accent); opacity: 0.7; transition: 0.3s;
    }
    
    .input-control {
        width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
        border-radius: 16px; padding: 16px 45px 16px 16px; color: var(--text-primary);
        font-family: 'Cairo', sans-serif; font-size: 14px; outline: none; transition: 0.3s;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    .input-control::placeholder { color: var(--text-muted); opacity: 0.5; font-size: 12px; }
    
    .input-wrap:focus-within .input-control {
        border-color: var(--accent); background: rgba(0,0,0,0.4);
        box-shadow: 0 0 0 3px var(--accent-glow), inset 0 2px 5px rgba(0,0,0,0.2);
    }
    .input-wrap:focus-within .input-icon { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-glow)); }

    /* تنسيق خاص بصندوق الوصف */
    textarea.input-control { padding-top: 16px; resize: none; min-height: 100px; }
    .textarea-icon { top: 24px; transform: none; }

    /* ── زر الحفظ ── */
    .btn-submit {
        width: 100%; padding: 18px; border-radius: 16px; font-weight: 800; font-size: 15px;
        background: linear-gradient(135deg, var(--accent-light), var(--accent-dark)); color: #fff;
        border: none; cursor: pointer; transition: 0.2s;
        box-shadow: 0 10px 25px var(--accent-glow); display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:active { transform: scale(0.97); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
</style>

<div class="px-2 pt-4 pb-24">

    <div class="mb-6 stagger-1">
        <a href="/admin/packages" onclick="playGlassSound()" class="inline-flex items-center gap-2 text-[var(--text-muted)] hover:text-[var(--accent)] transition-colors font-bold text-xs bg-[var(--bg-card)] border border-[var(--border)] px-4 py-2 rounded-full">
            <i class="fas fa-arrow-right"></i>
            <span>إدارة الباقات</span>
        </a>
    </div>

    <div class="text-center mb-8 stagger-1">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-[1.2rem] bg-[var(--bg-card)] border border-[var(--border-bright)] mb-3 shadow-[0_10px_20px_var(--glow)] rotate-3 hover:rotate-0 transition-transform">
            <i class="fas fa-box-open text-2xl text-[var(--accent)] drop-shadow-[0_0_8px_var(--accent-glow)]"></i>
        </div>
        <h1 class="text-2xl font-black text-[var(--text-primary)] tracking-tight">إضافة باقة جديدة</h1>
        <p class="text-xs text-[var(--text-muted)] mt-1">تحديد تفاصيل العرض لزبائنك</p>
    </div>

    <div class="glass-royal rounded-[32px] p-6 sm:p-8 stagger-2 relative overflow-hidden max-w-md mx-auto">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-[var(--accent-glow)] rounded-full blur-3xl pointer-events-none"></div>

        <form method="POST" id="addPackageForm" class="relative z-10">
            
            <div class="input-group">
                <label class="input-label">اسم الباقة</label>
                <div class="input-wrap">
                    <i class="fas fa-signature input-icon"></i>
                    <input type="text" name="name" required class="input-control" placeholder="مثال: باقة الملوك اليومية">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label class="input-label">السعر (ريال)</label>
                    <div class="input-wrap">
                        <i class="fas fa-money-bill-wave input-icon"></i>
                        <input type="number" step="0.01" name="price" required class="input-control" placeholder="0.00">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">عدد الأيام</label>
                    <div class="input-wrap">
                        <i class="fas fa-calendar-day input-icon"></i>
                        <input type="number" name="days" required class="input-control" placeholder="مثال: 30">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">وصف الباقة (اختياري)</label>
                <div class="input-wrap">
                    <i class="fas fa-align-right input-icon textarea-icon"></i>
                    <textarea name="desc" class="input-control" placeholder="اكتب ميزات الباقة أو تفاصيل الخطة هنا..."></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit mt-6" onmousedown="playGlassSound()">
                <i class="fas fa-cloud-upload-alt"></i>
                <span>حفظ الباقة بالنظام</span>
            </button>

        </form>
    </div>

    <p class="text-center mt-6 text-[var(--text-muted)] opacity-50 text-[10px] font-bold uppercase tracking-[0.2em] stagger-3">
        <i class="fas fa-shield-check ml-1"></i> يتم التشفير والحفظ فوراً في قاعدة البيانات
    </p>

</div>

<script>
    // ── حماية من الضغط المزدوج وإضافة تأثير التحميل ──
    document.getElementById('addPackageForm').onsubmit = function() {
        if(typeof playGlassSound === 'function') playGlassSound();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>جاري الحفظ...</span>';
    };
</script>

{% endblock %}
