<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عندل ستار - غير متصل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #0a1428; color: white; }
        .gold { color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="text-center px-6">
        <!-- الشعار -->
        <div class="mx-auto w-24 h-24 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-3xl flex items-center justify-center mb-8 shadow-2xl">
            <i class="fas fa-wifi-slash text-5xl text-slate-900"></i>
        </div>

        <h1 class="text-4xl font-black gold mb-3">عندل ستار</h1>
        <p class="text-2xl font-bold mb-2">أنت غير متصل بالإنترنت</p>
        <p class="text-lg text-white/70 mb-10">يرجى التحقق من اتصالك بالشبكة</p>

        <!-- زر إعادة المحاولة -->
        <button onclick="retryConnection()" 
                class="bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-900 font-bold text-xl px-12 py-5 rounded-3xl shadow-2xl hover:scale-105 transition-all flex items-center gap-3 mx-auto">
            <i class="fas fa-sync-alt"></i>
            إعادة المحاولة
        </button>

        <p class="text-xs text-white/40 mt-12">سيتم إعادة تحميل التطبيق تلقائياً عند عودة الاتصال</p>
    </div>

    <script>
        function retryConnection() {
            window.location.reload();
        }

        // إعادة المحاولة تلقائياً كل 8 ثواني
        setInterval(() => {
            if (navigator.onLine) window.location.reload();
        }, 8000);
    </script>
</body>
</html>
