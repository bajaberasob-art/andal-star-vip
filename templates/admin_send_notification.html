{% extends "base.html" %}
{% block content %}
<div class="p-6 max-w-md mx-auto">
    <h1 class="text-3xl font-bold mb-8">إرسال إشعار</h1>
    
    <form method="POST">
        <input type="text" name="title" placeholder="عنوان الإشعار" class="w-full p-4 rounded-3xl bg-white/10 mb-4" required>
        <textarea name="message" placeholder="نص الإشعار" class="w-full p-4 rounded-3xl bg-white/10 h-32" required></textarea>
        
        <select name="user_id" class="w-full p-4 rounded-3xl bg-white/10 my-4">
            <option value="">لكل الزبائن</option>
            {% for c in customers %}
            <option value="{{ c.id }}">{{ c.full_name }} - {{ c.phone }}</option>
            {% endfor %}
        </select>
        
        <button type="submit" class="w-full bg-emerald-500 py-6 rounded-3xl font-bold">إرسال الإشعار</button>
    </form>
</div>
{% endblock %}
