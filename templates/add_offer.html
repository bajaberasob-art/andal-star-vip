{% extends "base.html" %}
{% block content %}

<style>
    /* ── تأثيرات الظهور السلس ── */
    .stagger-1 { animation: fadeUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
    .stagger-2 { animation: fadeUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }
    .stagger-3 { animation: fadeUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both; }

    /* ── تنسيق الحقول الملكية ── */
    .input-group { margin-bottom: 20px; }
    .input-label {
        display: block; font-size: 11px; font-weight: 800; color: var(--text-muted);
        margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em;
    }
    
    .input-wrap { position: relative; }
    .input-icon {
        position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        color: var(--accent); opacity: 0.7; transition: 0.3s; pointer-events: none;
    }
    
    .input-control {
        width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
        border-radius: 16px; padding: 16px 45px 16px 16px; color: var(--text-primary);
        font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700;
        outline: none; transition: 0.3s; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    .input-control::placeholder { color: var(--text-muted); opacity: 0.5; font-size: 12px; font-weight: 600; }
    
    .input-wrap:focus-within .input-control {
        border-color: var(--accent); background: rgba(0,0,0,0.4);
        box-shadow: 0 0 0 3px var(--accent-glow), inset 0 2px 5px rgba(0,0,0,0.2);
    }
    .input-wrap:focus-within .input-icon { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-glow)); }

    /* تنسيق خاص للقائمة المنسدلة */
    select.input-control { appearance: none; cursor: pointer; }
    .select-chevron { left: 16px; right: auto; }

    /* ── زر الحفظ ── */
    .btn-submit {
        width: 100%; padding: 18px; border-radius: 16px; font-weight: 900; font-size: 16px;
        background: linear-gradient(135deg, var(--accent-light), var(--accent-dark)); color: #fff;
        border: none; cursor: pointer; transition: 0.2s;
        box-shadow: 0 10px 25px var(--accent-glow); display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-submit:active { transform: scale(0.97); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
</style>

<div class="px-2 pt-4 pb-24">

    <div class="mb-6 stagger-1">
        <a href="/admin/offers" onclick="playGlassSound()" class="inline-flex items-center gap-2 text-[var(--text-muted)] hover:text-[var(--accent)] transition-colors font-bold text-xs bg-[var(--bg-card)] border border-[var(--border)] px-4 py-2 rounded-full">
            <i class="fas fa-arrow-right"></i>
            <span>إدارة العروض</span>
        </a>
    </div>

    <div class="text-center mb-8 stagger-1">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-[1.2rem] bg-[var(--bg-card)] border border-[var(--border-bright)] mb-3 shadow-[0_10px_20px_var(--glow)] rotate-3 hover:rotate-0 transition-transform">
            <i class="fas fa-fire-flame-curved text-2xl text-[var(--accent)] drop-shadow-[0_0_8px_var(--accent-glow)] animate-pulse"></i>
        </div>
        <h1 class="text-2xl font-black text-[var(--text-primary)] tracking-tight">إضافة عرض حصري</h1>
        <p class="text-xs text-[var(--text-muted)] mt-1">أشعل المبيعات بخصومات لا تقاوم</p>
    </div>

    <div class="glass-royal rounded-[32px] p-6 sm:p-8 stagger-2 relative overflow-hidden max-w-md mx-auto mb-6">
        <div class="absolute -top-20 -left-20 w-48 h-48 bg-[var(--accent-glow)] rounded-full blur-[80px] pointer-events-none"></div>

        <form method="POST" id="addOfferForm" class="relative z-10">
            
            <div class="input-group">
                <label class="input-label">عنوان العرض الجذاب</label>
                <div class="input-wrap">
                    <i class="fas fa-heading input-icon"></i>
                    <input type="text" name="title" required class="input-control" placeholder="مثال: عرض نهاية الشهر الأسطوري">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">الشعار (الجملة الترويجية)</label>
                <div class="input-wrap">
                    <i class="fas fa-ad input-icon"></i>
                    <input type="text" name="slogan" required class="input-control" placeholder="مثال: اشترِ الآن ووفر الكثير!">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">الباقة المستهدفة</label>
                <div class="input-wrap">
                    <i class="fas fa-box-open input-icon"></i>
                    <select name="package_id" required class="input-control">
                        {% for p in packages %}
                        <option value="{{ p.id }}" style="background: var(--bg-primary);">{{ p.name }} - السعر الأساسي: {{ p.price | round(0) | int }} ر.ي</option>
                        {% endfor %}
                    </select>
                    <i class="fas fa-chevron-down input-icon select-chevron"></i>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">نسبة الخصم المطلوبة</label>
                <div class="input-wrap">
                    <i class="fas fa-percent input-icon"></i>
                    <input type="number" name="discount" required min="1" max="100" class="input-control" placeholder="مثال: 25 (لخصم 25%)">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit mt-8" onmousedown="playGlassSound()">
                <span>إطلاق العرض للنظام</span>
                <i class="fas fa-rocket"></i>
            </button>

        </form>
    </div>
    
    <p class="text-center text-[var(--text-muted)] opacity-50 text-[10px] font-bold uppercase tracking-[0.2em] stagger-3">
        <i class="fas fa-info-circle ml-1"></i> العروض تظهر للزبائن فوراً في المتجر
    </p>

</div>

<script>
    // ── حماية من الضغط المزدوج ──
    document.getElementById('addOfferForm').onsubmit = function() {
        if(typeof playGlassSound === 'function') playGlassSound();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>جاري تفعيل العرض...</span>';
    };
</script>

{% endblock %}
